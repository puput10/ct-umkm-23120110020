# Cek sederhana: semua file wajib ada dan tidak kosong. Tidak menilai isi.
name: Cek file wajib

on:
  push:
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cek file wajib
        run: |
          gagal=0
          for f in README.md docs/01-data-lapangan.md docs/02-decomposition.md \
                   docs/03-pattern-abstraction.md docs/04-algorithm.md docs/05-testing.md \
                   docs/06-refleksi.md docs/prompt-journal.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::File belum ada: $f"
              gagal=1
            elif ! grep -q '[^[:space:]]' "$f"; then
              echo "::error file=$f::File masih kosong: $f"
              gagal=1
            fi
          done
          if [ "$gagal" -ne 0 ]; then
            echo "Lengkapi file di atas, lalu commit dan push lagi."
            exit 1
          fi
          echo "Semua file wajib sudah ada dan tidak kosong."
