# Situs statis: tidak ada build command, folder utama repo langsung dipublikasikan.
[build]
  publish = "."
  # Hemat kredit Netlify (paket gratis: sekitar 20 deploy produksi per bulan).
  # Deploy dilewati hanya kalau commit cuma mengubah docs/ atau README.md.
  # Perubahan file lain (index.html, css/, js/, data/, tests/, gambar, dst.) tetap di-deploy.
  # Build pertama selalu jalan. Jangan ubah baris ini.
  ignore = "{ [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; } && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)README.md'"
